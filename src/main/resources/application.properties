spring.application.name=DolbomON

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.access-token-validity=${JWT_ACCESS_TOKEN_VALIDITY}

vertex.project-id=${GOOGLE_CLOUD_PROJECT_ID}
vertex.credentials-path=${VERTEX_CREDENTIALS_PATH}
vertex.location=${VERTEX_LOCATION:global}
vertex.model=${VERTEX_MODEL:gemini-2.5-flash}

server.port=${PORT:8080}

